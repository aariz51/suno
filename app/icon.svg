  <circle cx="168" cy="256" r="34" fill="#FBFAF7"/>
  <g fill="none" stroke="#FBFAF7" stroke-width="30" stroke-linecap="round">
    <path d="M223 177a96 96 0 0 1 0 158" transform="rotate(0 168 256)"/>
    <path d="M257 128a156 156 0 0 1 0 256" opacity="0.7"/>
    <path d="M292 79a216 216 0 0 1 0 354" opacity="0.42"/>
  </g>
</svg>
