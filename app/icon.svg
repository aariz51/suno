<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Suno">
  <!-- A broadcast: one source point, three arcs leaving it. It reads at 16px,
       it carries the product's single idea — a warning spoken outward — and it
       depicts no person and no face. -->
